[project]
name = "mcp-sqlserver"
version = "1.0.0"
description = "SAP B1 SQL Server MCP Server with intelligent backup management"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
